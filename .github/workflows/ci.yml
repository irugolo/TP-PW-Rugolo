name: CI

on:
  pull_request:
    branches: [main, feat/e2-nextjs]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Instalar y compilar Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
